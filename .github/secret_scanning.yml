# GitHub secret scanning and push protection skip Vitrine's made-up test credentials (the shape of Obscura G-41).
# Vitrine's trust lens is a secret detector (84 detectors ported from Obscura): its tests need text shaped exactly like
# real provider tokens. Every one is made up (project rule), and scan-fixtures-for-real-secrets.sh fails CI on any
# live-looking shape outside these test trees that is not on its allowlist. Push protection still covers the app, the
# extensions, the libraries, the web code, the tools, the scripts and the docs.
# roadmap: S-17
paths-ignore:
  - "app/Packages/Tests/**"
  - "app/VitrinePreviewKitTests/**"
  - "app/VitrineQuickActionsTests/**"
  - "app/VitrineWindowTests/**"
